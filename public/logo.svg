<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" role="img" aria-label="The Card Binder">
  <title>The Card Binder</title>
  <defs>
    <linearGradient id="markBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1f2e"/>
      <stop offset="1" stop-color="#12151c"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ec0ff"/>
      <stop offset="0.45" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#3d6fe0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g transform="translate(8 8)">
    <rect width="144" height="144" rx="32" fill="url(#markBg)"/>
    <rect x="1.5" y="1.5" width="141" height="141" rx="30.5" fill="none" stroke="#2d3548" stroke-width="3"/>
    <!-- binder rings -->
    <g fill="none" stroke="#8b95ab" stroke-width="3.2">
      <circle cx="18" cy="36" r="6.5"/>
      <circle cx="18" cy="72" r="6.5"/>
      <circle cx="18" cy="108" r="6.5"/>
    </g>
    <!-- 3x3 pockets -->
    <g>
      <!-- row 1 -->
      <rect x="36" y="22" width="28" height="32" rx="5" fill="#0e121b" stroke="#2d3548" stroke-width="1.6"/>
      <rect x="70" y="22" width="28" height="32" rx="5" fill="#0e121b" stroke="#2d3548" stroke-width="1.6"/>
      <rect x="104" y="22" width="28" height="32" rx="5" fill="#0e121b" stroke="#2d3548" stroke-width="1.6"/>
      <!-- row 2 -->
      <rect x="36" y="58" width="28" height="32" rx="5" fill="#0e121b" stroke="#2d3548" stroke-width="1.6"/>
      <rect x="70" y="56" width="30" height="36" rx="6" fill="url(#foil)" stroke="#c9dbff" stroke-width="1.4"/>
      <path d="M74 60 L96 84" stroke="url(#shine)" stroke-width="6" stroke-linecap="round"/>
      <rect x="104" y="58" width="28" height="32" rx="5" fill="#0e121b" stroke="#2d3548" stroke-width="1.6"/>
      <!-- row 3 -->
      <rect x="36" y="94" width="28" height="32" rx="5" fill="#0e121b" stroke="#2d3548" stroke-width="1.6"/>
      <rect x="70" y="94" width="28" height="32" rx="5" fill="#0e121b" stroke="#2d3548" stroke-width="1.6"/>
      <rect x="104" y="94" width="28" height="32" rx="5" fill="#0e121b" stroke="#2d3548" stroke-width="1.6"/>
    </g>
  </g>
  <text x="176" y="68" fill="#8b95ab" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="3">THE</text>
  <text x="176" y="118" fill="#e8ecf4" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700">Card <tspan fill="#7aa2ff">Binder</tspan></text>
</svg>
